# Testnet docker-compose
#
# Starts a local DKG test network:
#   anvil        – local EVM chain (Anvil, 2-second block time)
#   deployer     – builds contracts, deploys them, seeds node keys, serves addresses.env
#   dkg-node     – N participating DKG nodes (scale with --scale dkg-node=N, max 19)
#
# Each node auto-creates new epochs by default on the contract's cadence
# schedule (--auto-create-epochs=true). Bring the fleet up and the
# protocol drives itself end-to-end.
#
# Typical workflow:
#
#   # Start the network with 3 nodes
#   DKG_NODE_COUNT=3 docker compose up --scale dkg-node=3 anvil deployer dkg-node
#
#   # Tear down
#   docker compose down -v

x-build-image: &build-image
  build:
    context: ..
    dockerfile: Dockerfile
  image: davinci-dkg:testnet

x-chain-env: &chain-env
  CHAIN_ID: "1337"
  RPC_URL: "http://anvil:8545"

x-node-env: &node-env
  <<: *chain-env
  DAVINCI_DKG_WEB3_RPC: "http://anvil:8545"
  DAVINCI_DKG_LOG_LEVEL: "debug"
  DAVINCI_DKG_ARTIFACTS_DIR: /artifacts
  # The /shared bind mount is only used to coordinate atomic key-index
  # allocation between node replicas via mkdir-lock (see entrypoint-node.sh).
  # Ciphertext distribution is now on-chain via CiphertextSubmitted events.
  # Registry and Manager addresses are read from /addresses/addresses.env
  # via the entrypoint script.

services:
  # ── Chain ──────────────────────────────────────────────────────────────────
  anvil:
    image: ghcr.io/foundry-rs/foundry:stable
    entrypoint:
      - anvil
      - --host
      - "0.0.0.0"
      - --port
      - "8545"
      - --chain-id
      - "1337"
      - --accounts
      - "40"
      - --block-time
      - "2"
      - --hardfork
      - "cancun"
      - --disable-code-size-limit
      # Keep the per-block gas ceiling high so the heaviest deployments
      # (the Groth16 verifier wrappers) fit comfortably. (The earlier PoseidonT
      # precompile-style contracts no longer exist — v4 ships 4 Groth16
      # verifiers + DKGRegistry + DKGManager + DKGAppManager.)
      - --gas-limit
      - "100000000"
    ports:
      - "0.0.0.0:${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://localhost:8545"]
      interval: 3s
      timeout: 5s
      retries: 10

  # ── Deployer ───────────────────────────────────────────────────────────────
  deployer:
    build:
      context: ..
      dockerfile: testnet/Dockerfile.deployer
    depends_on:
      anvil:
        condition: service_healthy
    environment:
      <<: *chain-env
      PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
      # Phase windows and policy floors (constructor immutables), see DeployAll.s.sol.
      EPOCH_DURATION_BLOCKS: "${EPOCH_DURATION_BLOCKS:-100}"
      COMMITTEE_SELECTION_BLOCKS: "${COMMITTEE_SELECTION_BLOCKS:-25}"
      KEY_ASSEMBLY_BLOCKS: "${KEY_ASSEMBLY_BLOCKS:-25}"
      FINALIZE_GAP_BLOCKS: "${FINALIZE_GAP_BLOCKS:-5}"
    volumes:
      - addresses:/addresses
      - shared:/shared
    ports:
      - "${DEPLOYER_PORT:-8888}:8888"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/addresses.env"]
      interval: 3s
      timeout: 5s
      retries: 30

  # ── DKG nodes ──────────────────────────────────────────────────────────────
  # Scale with: docker compose up --scale dkg-node=N
  # Each replica uses a different Anvil private key based on its hostname index.
  dkg-node:
    <<: *build-image
    entrypoint: ["/bin/sh", "/testnet/entrypoint-node.sh"]
    depends_on:
      deployer:
        condition: service_healthy
    environment:
      <<: *node-env
      # Each replica picks its Anvil key by index: a mkdir lock on /shared gives
      # it the next free slot on this host, KEY_OFFSET shifts it for worker
      # hosts, and the key comes from testnet/anvil-keys.txt (accounts 0-31).
      KEY_OFFSET: "${DKG_KEY_OFFSET:-0}"
      DAVINCI_DKG_EPOCH_POLICY_THRESHOLD: "${DKG_THRESHOLD:-3}"
      DAVINCI_DKG_EPOCH_POLICY_COMMITTEE_SIZE: "${DKG_COMMITTEE_SIZE:-4}"
      DAVINCI_DKG_EPOCH_POLICY_MIN_VALID_CONTRIBUTIONS: "${DKG_MIN_VALID_CONTRIBUTIONS:-3}"
      DAVINCI_DKG_EPOCH_POLICY_LOTTERY_ALPHA_BPS: "${DKG_ALPHA_BPS:-15000}"
    volumes:
      - addresses:/addresses:ro
      - ${DAVINCI_ARTIFACTS_HOST_DIR:-${HOME:-/root}/.davinci/artifacts}:/artifacts:ro
      - shared:/shared
      - ../testnet:/testnet:ro   # entrypoint scripts

  # The testnet does NOT bundle a UI service any more. The new ui/
  # Dockerfile bakes chain config at build time, but the deployer's
  # addresses are only known at runtime — reconciling those needs a
  # runtime templating layer that's specific to this scenario.
  #
  # To browse the local chain instead, in another terminal run:
  #
  #   make ui-dev \
  #     RPC_URL=http://127.0.0.1:8545 \
  #     MANAGER_ADDRESS=$(grep MANAGER testnet/addresses.env | cut -d= -f2) \
  #     CHAIN_ID=1337 CHAIN_NAME=anvil-testnet
  #
  # (After `make testnet-up` has produced testnet/addresses.env via the
  # deployer.) Vite's dev server on :5174 serves the UI against your
  # locally-running Anvil.

  # The standalone scenario orchestrator (dkg-runner) was removed: each
  # davinci-dkg-node now auto-creates new epochs by default
  # (--auto-create-epochs=true) on the contract's cadence schedule. To
  # drive a one-shot end-to-end run, just bring the node fleet up with
  # `make testnet-up` and watch progress via `make testnet-logs`.

volumes:
  addresses: {}
  shared: {}
