# Compose override for a fleet that serves the battery. Layer it over the
# testnet stack (the Makefile's `battery-testnet-up` and the battery workflow
# do):
#
#   cd testnet && docker compose -f docker-compose.yml \
#     -f ../tests/battery/compose.battery.yml up -d --build --scale dkg-node=4
#
services:
  dkg-node:
    # Every epoch deals MAX_K = 16 pool keys; with batched finalization a
    # single proof-carrying `finalizeEpoch` stores all of them at once, so
    # every key of a Live epoch is claimable immediately — there is no
    # activation step any more (the v3.1 `DAVINCI_DKG_ACTIVATE_AHEAD`
    # override is gone).
    # (v3.1, superseded: nodes kept only two keys activated ahead of the
    # claim cursor, and the swarm's burst of registrations would have
    # stalled on the activation rotation.)
