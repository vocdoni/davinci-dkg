# Compose override for a fleet that serves the battery. Layer it over the
# testnet stack (the Makefile's `battery-testnet-up` and the battery workflow
# do):
#
#   cd testnet && docker compose -f docker-compose.yml \
#     -f ../tests/battery/compose.battery.yml up -d --build --scale dkg-node=4
#
services:
  dkg-node:
    environment:
      # Every epoch deals MAX_K = 8 pool keys, but a node only keeps
      # ActivateAhead (default 2) of them activated past the claim cursor,
      # one activation proof per tick. A registration claims the next
      # *activated* key and reverts PoolKeyNotActive otherwise, so a burst of
      # more than two concurrent registrations — the organizer swarm fires up
      # to MAX_K at once, the ciphertext adversary claims six keys in one
      # epoch — would wait on the fleet's activation rotation, or fail. The
      # battery fleet therefore activates the whole pool as soon as an epoch
      # goes Live. (Side effect: with ActivateAhead = MAX_K the early
      # createEpoch trigger fires after every claim; the contract rejects it
      # at gas estimation until at most one key is left, no gas is spent.)
      DAVINCI_DKG_ACTIVATE_AHEAD: "8"
