name: Publish Circuits

# Triggered manually by adding the 'trigger-upload-circuits' label to a PR.
# Recompiles all 4 circuits (a fresh Groth16 setup), pins the new hashes in
# config/circuit_artifacts.go and the verifier wrappers, stages the ccs/pk/vk
# files as `<sha256>.<ext>` release assets, and posts a comment with download
# instructions. Nodes fetch artifacts from the GitHub release named by
# config.DefaultArtifactsRelease, so the staged assets go there
# (gh release upload) and the pinned config is committed alongside.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: circuits-upload-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  upload:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.action == 'labeled' &&
        github.event.label.name == 'trigger-upload-circuits' &&
        github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
      }}
    # Self-hosted: the 3.0M-constraint contribution setup takes ~10 min and
    # several GB of RAM on our boxes; a GitHub-hosted runner is 5–10× slower.
    runs-on: [self-hosted]
    timeout-minutes: 120
    env:
      LOG_LEVEL: debug

    steps:
      - name: Remove PR label
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'trigger-upload-circuits',
              });
            } catch (err) {
              core.warning(`Failed to remove label: ${err.message}`);
            }

      # Some self-hosted runners export no HOME (z5 runs as root under
      # systemd); go needs one and ~/.davinci/artifacts lives under it. The
      # compile JSON stays out of /tmp too: the integration and battery jobs
      # on the same box write /tmp/circuit-artifacts.json.
      - name: Give the run a home
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "CIRCUIT_ARTIFACTS_JSON=$RUNNER_TEMP/circuit-artifacts.json" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # circuits-compile writes the artifacts to ~/.davinci/artifacts and the
      # *_vkey.sol verifiers; circuits-update-hashes patches
      # config/circuit_artifacts.go and PROVING_KEY_HASH in the wrappers, so
      # the config, verifiers and assets uploaded below come from one setup.
      - name: Compile circuits and pin the new hashes
        run: make circuits-compile circuits-update-hashes

      - name: Stage release assets
        run: python3 scripts/stage-circuit-release.py "$HOME/.davinci/artifacts" "$RUNNER_TEMP/release-assets"

      - name: Store circuit artifact config
        uses: actions/upload-artifact@v4
        with:
          name: davinci-dkg-circuits-config
          if-no-files-found: error
          path: |
            config/circuit_artifacts.go
            solidity/src/verifiers/ContributionVerifier.sol
            solidity/src/verifiers/PoolKeyVerifier.sol
            solidity/src/verifiers/PartialDecryptVerifier.sol
            solidity/src/verifiers/DecryptCombineVerifier.sol
            solidity/src/verifiers/contribution_vkey.sol
            solidity/src/verifiers/poolkey_vkey.sol
            solidity/src/verifiers/partialdecrypt_vkey.sol
            solidity/src/verifiers/decryptcombine_vkey.sol

      - name: Store release assets
        uses: actions/upload-artifact@v4
        with:
          name: davinci-dkg-circuits-assets
          if-no-files-found: error
          path: ${{ runner.temp }}/release-assets/*

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId || process.env.GITHUB_RUN_ID || 'UNKNOWN_RUN_ID';
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const body =
              `Circuit artifact upload finished.\n\n` +
              `Download the pinned config + verifiers and the staged release assets:\n\n` +
              `\`\`\`bash\n` +
              `gh run download ${runId} -R ${repo} -n davinci-dkg-circuits-config\n` +
              `gh run download ${runId} -R ${repo} -n davinci-dkg-circuits-assets -D release-assets\n` +
              `gh release upload <circuits-vN> release-assets/* -R ${repo}\n` +
              `\`\`\`\n\n` +
              `Commit the config and verifiers together with the matching config.DefaultArtifactsRelease.\n`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
