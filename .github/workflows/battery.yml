name: Fleet Battery

# Brings up the multi-node testnet (Anvil + deployer + 4 real nodes) and runs
# the load / adversarial battery against it with small parameters. Self-hosted:
# it needs Docker, the Groth16 setup (the 3.0M-constraint contribution circuit
# alone takes ~10 min) and up to an hour of wall clock.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  battery:
    name: Battery against a 4-node testnet
    runs-on: [self-hosted]
    if: github.event.pull_request.draft != true
    concurrency:
      group: self-hosted-integration
      cancel-in-progress: false
    # ~12 min circuit setup + node image build + the 40 min test budget below.
    timeout-minutes: 100
    env:
      # Isolate this stack from any testnet already running on the host:
      # its own compose project name and its own host ports.
      COMPOSE_PROJECT_NAME: dkg-battery-ci
      ANVIL_PORT: "18545"
      DEPLOYER_PORT: "18888"
      DAVINCI_DKG_BATTERY: "1"
      DAVINCI_DKG_TEST_RPC_URL: http://127.0.0.1:18545
      DAVINCI_DKG_TEST_ADDRESSES: ${{ github.workspace }}/battery-addresses.env
      DAVINCI_ARTIFACTS_DIR: ${{ github.workspace }}/.artifacts
      DAVINCI_DKG_BATTERY_REPORT: ${{ github.workspace }}/battery-report.json
      # Testnet sizing: 4 nodes, committee 3 of 4, t = 2, short windows.
      DKG_THRESHOLD: "2"
      DKG_COMMITTEE_SIZE: "3"
      DKG_MIN_VALID_CONTRIBUTIONS: "2"
      EPOCH_DURATION_BLOCKS: "150"
      COMMITTEE_SELECTION_BLOCKS: "15"
      KEY_ASSEMBLY_BLOCKS: "30"
      FINALIZE_GAP_BLOCKS: "3"
      # Battery sizing.
      BATTERY_ORGANIZERS: "2"
      BATTERY_CIPHERTEXTS: "2"
      BATTERY_MIN_SERVICE_BLOCKS: "40"
      BATTERY_WITHHELD_WAIT_BLOCKS: "20"
      BATTERY_NO_COMBINE_WAIT_BLOCKS: "20"
      BATTERY_COMBINE_WAIT_BLOCKS: "90"
    steps:
      # The self-hosted runner does not export HOME; go, foundryup and docker
      # all need one. Keep it per run so nothing leaks between jobs.
      - name: Give the run a home
        run: |
          mkdir -p "$RUNNER_TEMP/home/.docker"
          echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/home/.docker" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install Foundry (deployer image)
        uses: foundry-rs/foundry-toolchain@v1
      - name: Regenerate circuit artifacts and Solidity verifiers
        # Same reason as the integration job: the committed hashes and
        # verifiers come from one setup run and must match the proving keys.
        run: make circuits-compile circuits-update-hashes solidity-build ARTIFACTS_DIR="$DAVINCI_ARTIFACTS_DIR"
      - name: Start the testnet
        working-directory: testnet
        # The battery override makes the nodes activate the whole MAX_K pool
        # of every epoch (DAVINCI_DKG_ACTIVATE_AHEAD=8): the swarm registers
        # its organizers in one burst and a registration only claims an
        # activated key. See tests/battery/compose.battery.yml.
        run: |
          DAVINCI_ARTIFACTS_HOST_DIR="$DAVINCI_ARTIFACTS_DIR" \
            docker compose -f docker-compose.yml -f ../tests/battery/compose.battery.yml \
            up -d --build --scale dkg-node=4
          for _ in $(seq 1 100); do
            curl -fsS "http://127.0.0.1:$DEPLOYER_PORT/addresses.env" > "$DAVINCI_DKG_TEST_ADDRESSES" && break
            sleep 3
          done
          cat "$DAVINCI_DKG_TEST_ADDRESSES"
      - name: Organizer swarm and reveal adversary
        run: |
          go test ./tests/battery -run 'TestOrganizerSwarm|TestRevealAdversary' \
            -v -count=1 -timeout 40m
      - name: Battery report
        if: always()
        run: cat "${DAVINCI_DKG_BATTERY_REPORT%.json}.md" || true
      - name: Node logs on failure
        if: failure()
        working-directory: testnet
        run: docker compose logs --tail=200 dkg-node
      - name: Tear down
        if: always()
        working-directory: testnet
        run: docker compose down -v
