name: Fleet Battery

# Brings up the multi-node testnet (Anvil + deployer + 4 real nodes) and runs
# the load / adversarial battery against it with small parameters. Self-hosted:
# it needs Docker, the Groth16 setup and about fifteen minutes of wall clock.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  battery:
    name: Battery against a 4-node testnet
    runs-on: [self-hosted]
    if: github.event.pull_request.draft != true
    concurrency:
      group: self-hosted-integration
      cancel-in-progress: false
    timeout-minutes: 60
    env:
      DAVINCI_DKG_BATTERY: "1"
      DAVINCI_DKG_TEST_RPC_URL: http://127.0.0.1:8545
      DAVINCI_DKG_TEST_ADDRESSES: /tmp/battery-addresses.env
      DAVINCI_ARTIFACTS_DIR: ${{ github.workspace }}/.artifacts
      DAVINCI_DKG_BATTERY_REPORT: ${{ github.workspace }}/battery-report.json
      # Testnet sizing: 4 nodes, committee 3 of 4, t = 2, short windows.
      DKG_THRESHOLD: "2"
      DKG_COMMITTEE_SIZE: "3"
      DKG_MIN_VALID_CONTRIBUTIONS: "2"
      EPOCH_DURATION_BLOCKS: "150"
      COMMITTEE_SELECTION_BLOCKS: "15"
      KEY_ASSEMBLY_BLOCKS: "30"
      FINALIZE_GAP_BLOCKS: "3"
      # Battery sizing.
      BATTERY_ORGANIZERS: "2"
      BATTERY_CIPHERTEXTS: "2"
      BATTERY_MIN_SERVICE_BLOCKS: "40"
      BATTERY_WITHHELD_WAIT_BLOCKS: "20"
      BATTERY_NO_COMBINE_WAIT_BLOCKS: "20"
      BATTERY_COMBINE_WAIT_BLOCKS: "90"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Foundry (deployer image)
        uses: foundry-rs/foundry-toolchain@v1
      - name: Regenerate circuit artifacts and Solidity verifiers
        # Same reason as the integration job: the committed hashes and
        # verifiers come from one setup run and must match the proving keys.
        run: make circuits-compile circuits-update-hashes solidity-build
      - name: Start the testnet
        working-directory: testnet
        run: |
          DAVINCI_ARTIFACTS_HOST_DIR="$DAVINCI_ARTIFACTS_DIR" \
            docker compose up -d --build --scale dkg-node=4
          for i in $(seq 1 100); do
            curl -fsS http://127.0.0.1:8888/addresses.env > "$DAVINCI_DKG_TEST_ADDRESSES" && break
            sleep 3
          done
          cat "$DAVINCI_DKG_TEST_ADDRESSES"
      - name: Organizer swarm and share adversary
        run: |
          go test ./tests/battery -run 'TestOrganizerSwarm|TestShareAdversary' \
            -v -count=1 -timeout 40m
      - name: Battery report
        if: always()
        run: cat "${DAVINCI_DKG_BATTERY_REPORT%.json}.md" || true
      - name: Node logs on failure
        if: failure()
        working-directory: testnet
        run: docker compose logs --tail=200 dkg-node
      - name: Tear down
        if: always()
        working-directory: testnet
        run: docker compose down -v
