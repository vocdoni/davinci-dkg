name: Test Circuits

on:
  pull_request:
    paths:
      - 'circuits/**'
      - 'crypto/**'
      - 'config/circuit_artifacts.go'
  push:
    paths:
      - 'circuits/**'
      - 'crypto/**'
      - 'config/circuit_artifacts.go'
    branches:
      - dev
      - stage
      - main
      - release**
  schedule:
    - cron: "0 1 * * *" # 02:00 UTC+1

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-push-{1}-{2}', github.workflow, github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  job_go_test_circuits:
    name: Circuit Tests
    # Self-hosted: the contribution circuit is 3.0M constraints (MaxN=32,
    # MaxK=8). Its Groth16 setup alone takes ~10 min and its test package
    # ~20 min on our boxes with a proving key around a gigabyte; a
    # GitHub-hosted runner (4 vCPU, 16 GB) is 5–10× slower and would blow
    # the 2 h per-package go timeout, if not its RAM.
    runs-on: [self-hosted]
    timeout-minutes: 150
    env:
      LOG_LEVEL: debug

    steps:
      # Some self-hosted runners export no HOME (z5 runs as root under
      # systemd); go and the ~/.davinci/artifacts cache below need one.
      - name: Give the run a home
        run: mkdir -p "$RUNNER_TEMP/home" && echo "HOME=$RUNNER_TEMP/home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false # self-hosted: the box keeps its own build cache

      - name: Restore circuit artifact cache
        uses: actions/cache@v4
        with:
          path: ~/.davinci/artifacts
          key: circuits-${{ hashFiles('config/circuit_artifacts.go') }}
          restore-keys: circuits-

      - name: Run all circuit tests (prove + verify)
        # Includes Test*ArtifactsMatchCompiledCircuit in every circuit
        # package, which checks the hashes pinned in
        # config/circuit_artifacts.go against the compiled circuits.
        run: |
          go test -v ./circuits/... \
            -failfast \
            -timeout=2h
